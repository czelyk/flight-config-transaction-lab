name: C transaction tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-11-01
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified 2026-11-01
        with:
          python-version: '3.12'
      - name: Build and execute real C fault campaigns
        run: python tools/run_tests.py
      - name: Independently check raw results
        run: python tools/analyze.py
      - name: Replay one mixed-generation witness
        run: python tools/replay_case.py
      - name: CMake and CTest on Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
